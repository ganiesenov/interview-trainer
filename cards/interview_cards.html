<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Карточки — LLM / NLP интервью</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4;
  --surface:#FFFFFF;
  --ink:#10182B;
  --muted:#5A6577;
  --line:#D5DCE5;
  --accent:#2B4ACB;
  --warn:#C97A16;
  --miss:#B23A48;
  --ok:#1E7A5E;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:16px;line-height:1.5;
  min-height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 28px;min-height:100dvh;display:flex;flex-direction:column}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.counter{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.06em}
.tabbtn{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--muted);
  padding:6px 10px;border-radius:999px;cursor:pointer
}
.tabbtn:hover{border-color:var(--accent);color:var(--accent)}
.tabbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* progress rail */
.rail{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px}
.rail i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}

.selrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
#trackSel,#topicSel{
  width:100%;min-width:0;padding:10px 26px 10px 12px;
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;
  color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:9px;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235A6577'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
}
#trackSel:focus-visible,#topicSel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* card */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 20px;flex:1;display:flex;flex-direction:column;
  box-shadow:0 1px 2px rgba(16,24,43,.04),0 8px 24px -18px rgba(16,24,43,.4);
}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin-bottom:14px;display:flex;gap:10px;align-items:center
}
.eyebrow .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
.q{
  font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;
  font-size:23px;line-height:1.32;letter-spacing:-.01em;margin:0 0 6px;
}
.hint{font-size:13.5px;color:var(--muted);margin:10px 0 0}

/* confidence */
.conf{margin-top:auto;padding-top:22px;display:grid;gap:8px}
.conf .lab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cbtn{
  width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:13px 15px;font:inherit;font-size:15px;color:var(--ink);
  cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;
  transition:border-color .15s,background .15s,transform .08s
}
.cbtn:active{transform:scale(.99)}
.cbtn:hover{border-color:var(--accent)}
.cbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cbtn span.k{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}

/* reveal */
.points{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px}
.pt{
  display:flex;gap:12px;align-items:flex-start;
  border:1px solid var(--line);border-radius:10px;padding:12px 13px;
  background:var(--surface);cursor:pointer;text-align:left;font:inherit;width:100%;color:var(--ink);
  transition:border-color .15s,background .15s;
  animation:rise .32s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.pt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pt .box{
  flex:0 0 18px;width:18px;height:18px;border:1.5px solid var(--line);border-radius:5px;margin-top:2px;
  display:grid;place-items:center;font-size:11px;color:#fff;transition:.15s
}
.pt .txt{font-size:14.5px;line-height:1.45}
.pt[data-on="1"]{border-color:var(--ok);background:#F1F8F5}
.pt[data-on="1"] .box{background:var(--ok);border-color:var(--ok)}
.pt[data-on="1"] .box::after{content:"✓"}

.refbox{
  margin-top:16px;border-left:2px solid var(--accent);padding:2px 0 2px 14px;
  font-size:14px;color:var(--muted);line-height:1.55
}
.refbox b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:5px;font-weight:500}

/* result */
.gap{
  margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)
}
.gaprow{display:flex;align-items:center;gap:12px;padding:13px 15px}
.gaprow+.gaprow{border-top:1px solid var(--line)}
.gaprow .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;flex:1}
.gaprow .v{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500}
.verdict{padding:14px 15px;font-size:14.5px;line-height:1.5;border-top:1px solid var(--line)}
.verdict.over{background:#FDF6EC;color:#7A4A0B}
.verdict.fair{background:#F1F8F5;color:#15563F}
.verdict.under{background:#F0F3FD;color:#1E357F}

.primary{
  margin-top:16px;width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;
  padding:15px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:transform .08s,filter .15s
}
.primary:active{transform:scale(.99)}
.primary:hover{filter:brightness(1.08)}
.primary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ghost{
  margin-top:8px;width:100%;background:none;color:var(--muted);border:1px solid var(--line);border-radius:10px;
  padding:12px;font:inherit;font-size:14px;cursor:pointer
}
.ghost:hover{border-color:var(--accent);color:var(--accent)}

/* stats */
.srow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.srow .t{flex:1;font-size:14.5px}
.srow .bar{flex:0 0 92px;height:6px;background:var(--line);border-radius:6px;overflow:hidden;position:relative}
.srow .bar i{position:absolute;top:0;left:0;height:100%;border-radius:6px}
.srow .p{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);width:40px;text-align:right}
.empty{color:var(--muted);font-size:14.5px;padding:24px 0;line-height:1.6}
.big{font-family:"IBM Plex Serif",serif;font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1}
.biglab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Карточки · LLM/NLP</div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="counter" id="counter"></div>
      <button class="tabbtn" id="tabBtn">Разбор</button>
    </div>
  </div>
  <div class="rail"><i id="rail"></i></div>
  <div class="selrow">
    <select id="trackSel" aria-label="Направление"></select>
    <select id="topicSel" aria-label="Тема"></select>
  </div>
  <div id="view"></div>
</div>

/* ---------- хранилище: артефакт → localStorage → память ---------- */
const KEY="cards_v1";
let mem=null;
async function load(){
  try{ if(window.storage){const r=await window.storage.get(KEY); return r?JSON.parse(r.value):{}} }catch(e){}
  try{ const v=localStorage.getItem(KEY); return v?JSON.parse(v):{} }catch(e){}
  return mem||{};
}
async function save(d){
  mem=d;
  try{ if(window.storage){await window.storage.set(KEY,JSON.stringify(d)); return} }catch(e){}
  try{ localStorage.setItem(KEY,JSON.stringify(d)) }catch(e){}
}

let hist={};           // id -> {seen, actual, exp, gap}
let queue=[];
let cur=null, phase="ask", conf=null, checked=new Set(), tab="deck";

let track="all", topic="all";
function pool(){
  let p=CARDS;
  if(track!=="all"){p=p.filter(c=>c.track===track); if(topic!=="all")p=p.filter(c=>c.topic===topic);}
  return p;
}
function buildQueue(){
  const p=pool();
  const fresh=p.filter(c=>!hist[c.id]);
  const weak=p.filter(c=>hist[c.id]&&hist[c.id].actual<.8).sort((a,b)=>hist[a.id].actual-hist[b.id].actual);
  const done=p.filter(c=>hist[c.id]&&hist[c.id].actual>=.8);
  queue=[...shuffle(fresh),...weak,...shuffle(done)];
}
function left(list){return list.filter(c=>!hist[c.id]||hist[c.id].actual<.8).length}
function fillTopics(){
  const ts=document.getElementById("trackSel"), qs=document.getElementById("topicSel");
  const tracks={};
  CARDS.forEach(c=>(tracks[c.track]??=[]).push(c));
  ts.innerHTML=[`<option value="all">ВПЕРЕМЕШКУ · ${CARDS.length} · ост. ${left(CARDS)}</option>`]
    .concat(Object.keys(tracks).sort().map(t=>`<option value="${esc(t)}">${esc(t.toUpperCase())} · ${tracks[t].length} · ост. ${left(tracks[t])}</option>`)).join("");
  ts.value=track;

  if(track==="all"){qs.disabled=true;qs.innerHTML='<option>случайный вопрос</option>';}
  else{
    qs.disabled=false;
    const sub={};
    tracks[track].forEach(c=>(sub[c.topic]??=[]).push(c));
    qs.innerHTML=[`<option value="all">ВСЕ ТЕМЫ · ост. ${left(tracks[track])}</option>`]
      .concat(Object.keys(sub).sort().map(t=>`<option value="${esc(t)}">${esc(t.toUpperCase())} · ${sub[t].length}</option>`)).join("");
    qs.value=topic;
  }
  const reset=()=>{buildQueue();cur=null;phase="ask";conf=null;checked.clear();render()};
  ts.onchange=()=>{track=ts.value;topic="all";reset()};
  qs.onchange=()=>{topic=qs.value;reset()};
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const p=pool();
  const seen=p.filter(c=>hist[c.id]).length;
  rail.style.width=(seen/Math.max(p.length,1)*100)+"%";
  counter.textContent=seen+" / "+p.length;
  tabBtn.textContent = tab==="deck" ? "Разбор" : "К карточкам";
  document.querySelector(".selrow").style.display = tab==="stats" ? "none" : "grid";
  view.innerHTML = tab==="stats" ? stats() : deck();
  fillTopics();
  bind();
}

function deck(){
  if(!cur) cur=queue[0];
  if(!cur) return `<div class="card"><p class="empty">Карточки кончились. Открой разбор — там видно, где самооценка расходится с делом.</p></div>`;
  const head=`<div class="card">
    <div class="eyebrow">${esc(cur.topic)}<span class="dot"></span>${cur.points.length} пунктов</div>
    <h1 class="q">${esc(cur.q)}</h1>`;

  if(phase==="ask"){
    return head+`<p class="hint">Ответь про себя вслух целиком, и только потом оценивай — иначе замер не сработает.</p>
      <div class="conf"><div class="lab">Насколько уверен</div>
        ${Object.entries(CONF).map(([k,v])=>`<button class="cbtn" data-conf="${k}">${v.label}<span class="k">${v.k}</span></button>`).join("")}
      </div></div>`;
  }

  const list=cur.points.map((p,i)=>`<button class="pt" data-i="${i}" data-on="${checked.has(i)?1:0}" style="animation-delay:${i*45}ms">
      <span class="box"></span><span class="txt">${esc(p)}</span></button>`).join("");

  if(phase==="reveal"){
    return head+`<p class="hint">Отметь только то, что действительно прозвучало в твоём ответе.</p>
      <ul class="points">${list}</ul>
      <button class="primary" id="done">Готово · отмечено ${checked.size} из ${cur.points.length}</button></div>`;
  }

  const actual=checked.size/cur.points.length;
  const exp=CONF[conf].exp, gap=exp-actual;
  const cls = gap>.22?"over":(gap<-.18?"under":"fair");
  const msg = gap>.22
      ? "Классический разрыв: узнать формулировку легко, произнести — нет. Эта карточка вернётся."
      : (gap<-.18?"Знаешь лучше, чем думаешь. Неуверенность на интервью читается, а зря."
                 :"Самооценка совпала с делом — по этой теме себе можно доверять.");
  return head+`<ul class="points">${list}</ul>
    <div class="refbox"><b>Эталон</b>${esc(cur.ref)}</div>
    <div class="gap">
      <div class="gaprow"><span class="n">Ожидал</span><span class="v">${Math.round(exp*100)}%</span></div>
      <div class="gaprow"><span class="n">Назвал</span><span class="v" style="color:${actual>=.8?'var(--ok)':actual>=.5?'var(--warn)':'var(--miss)'}">${Math.round(actual*100)}%</span></div>
      <div class="verdict ${cls}">${msg}</div>
    </div>
    <button class="primary" id="next">Следующий вопрос</button>
    <button class="ghost" id="again">Ещё раз этот</button></div>`;
}

function stats(){
  const ids=Object.keys(hist);
  if(!ids.length) return `<div class="card"><p class="empty">Пока нечего разбирать. Пройди пять-шесть карточек, и здесь появится, где ты себя переоцениваешь.</p></div>`;
  const gaps=ids.map(i=>hist[i].gap);
  const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
  const byTopic={};
  ids.forEach(i=>{const c=CARDS.find(x=>x.id===i);(byTopic[c.track]??=[]).push(hist[i])});
  const rows=Object.entries(byTopic).sort((a,b)=>avgOf(b[1])-avgOf(a[1])).map(([t,v])=>{
    const g=avgOf(v), pct=Math.round(avgOf2(v)*100);
    const col=g>.22?"var(--miss)":g>.08?"var(--warn)":"var(--ok)";
    return `<div class="srow"><span class="t">${esc(t)}</span>
      <span class="bar"><i style="width:${pct}%;background:${col}"></i></span>
      <span class="p">${pct}%</span></div>`;
  }).join("");
  return `<div class="card">
    <div class="eyebrow">Разрыв самооценки</div>
    <div class="big" style="color:${avg>.22?'var(--miss)':avg>.08?'var(--warn)':'var(--ok)'}">${avg>0?"+":""}${Math.round(avg*100)}%</div>
    <div class="biglab">насколько в среднем переоцениваешь себя</div>
    <div style="margin-top:22px">${rows}</div>
    <p class="hint" style="margin-top:18px">Полоска — доля реально названных пунктов. Красный цвет значит, что по теме ты уверен сильнее, чем отвечаешь.</p>
    <button class="ghost" id="reset" style="margin-top:14px">Сбросить прогресс</button></div>`;
}
const avgOf=v=>v.reduce((a,b)=>a+b.gap,0)/v.length;
const avgOf2=v=>v.reduce((a,b)=>a+b.actual,0)/v.length;

function bind(){
  document.querySelectorAll("[data-conf]").forEach(b=>b.onclick=()=>{conf=b.dataset.conf;phase="reveal";checked.clear();render()});
  document.querySelectorAll(".pt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; checked.has(i)?checked.delete(i):checked.add(i);
    if(phase==="reveal"){const d=document.getElementById("done"); b.dataset.on=checked.has(i)?1:0; d.textContent=`Готово · отмечено ${checked.size} из ${cur.points.length}`;}
    else render();
  });
  const d=document.getElementById("done"); if(d) d.onclick=async()=>{
    const actual=checked.size/cur.points.length, exp=CONF[conf].exp;
    hist[cur.id]={seen:(hist[cur.id]?.seen||0)+1,actual,exp,gap:exp-actual};
    await save(hist); phase="result"; render();
  };
  const n=document.getElementById("next"); if(n) n.onclick=()=>{
    buildQueue(); const rest=queue.filter(c=>c.id!==cur.id);
    cur=rest[0]||queue[0]; phase="ask"; conf=null; checked.clear(); render();
  };
  const a=document.getElementById("again"); if(a) a.onclick=()=>{phase="ask";conf=null;checked.clear();render()};
  const r=document.getElementById("reset"); if(r) r.onclick=async()=>{hist={};await save(hist);buildQueue();cur=null;phase="ask";tab="deck";render()};
}
tabBtn.onclick=()=>{tab=tab==="deck"?"stats":"deck";render()};
document.addEventListener("keydown",e=>{
  if(phase==="ask"){const m={"1":"sure","2":"part","3":"no"}[e.key]; if(m){conf=m;phase="reveal";checked.clear();render()}}
});

(async()=>{hist=await load()||{};buildQueue();render()})();
</script>
</body>
</html>
