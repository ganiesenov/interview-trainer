# Банк вопросов по матчасти.
# Знание живёт здесь, а не в модели: key_points + reference — то, с чем
# механически сверяется ответ кандидата.
#
# Формат:
#   id / topic / question / key_points (список) / reference (4-6 предложений)
#
# Это 5 вопросов-заглушек для проверки движка. Дальше банк наполняется руками.

- id: kv_cache_01
  topic: inference
  question: "Зачем нужен KV-cache и что он ломает при батчинге?"
  key_points:
    - "на каждом шаге генерации K и V для прошлых токенов не меняются"
    - "без кэша сложность на последовательность O(n^3), с кэшем O(n^2)"
    - "память растёт линейно по длине и по батчу: 2 * n_layers * n_heads * d_head * len"
    - "разная длина в батче даёт фрагментацию — отсюда PagedAttention в vLLM"
  reference: |
    При авторегрессионной генерации ключи и значения уже сгенерированных токенов
    не меняются, поэтому их пересчёт на каждом шаге — чистая трата. KV-cache
    хранит K и V всех слоёв, превращая генерацию последовательности из O(n^3) в
    O(n^2): на каждом шаге считается только текущий токен против кэша.
    Плата — память: 2 * n_layers * n_heads * d_head * len на элемент батча, и
    растёт она линейно по длине контекста и по размеру батча, так что на длинных
    контекстах кэш занимает больше, чем сами веса. При батчинге последовательности
    имеют разную длину и заканчиваются в разное время, поэтому непрерывное
    выделение под максимальную длину даёт фрагментацию и недоиспользование VRAM —
    ради этого в vLLM придумали PagedAttention с блочным выделением, а MQA/GQA
    уменьшают сам размер кэша, сокращая число KV-голов.

- id: attention_scale_01
  topic: architecture
  question: "Выведи scaled dot-product attention и объясни, зачем делить на корень из d_k."
  key_points:
    - "Attention(Q,K,V) = softmax(QK^T / sqrt(d_k)) V"
    - "Q, K, V — линейные проекции входа, скор — скалярное произведение запроса и ключа"
    - "при независимых компонентах с дисперсией 1 дисперсия QK^T растёт как d_k"
    - "большие по модулю логиты загоняют softmax в насыщение и градиенты зануляются"
    - "деление на sqrt(d_k) возвращает дисперсию логитов к 1"
  reference: |
    Вход проецируется тремя матрицами в Q, K и V. Похожесть запроса и ключа
    считается скалярным произведением, матрица скоров QK^T нормируется softmax по
    последней оси и взвешивает V: Attention(Q,K,V) = softmax(QK^T / sqrt(d_k)) V.
    Если компоненты q и k независимы, с нулевым средним и единичной дисперсией,
    то их скалярное произведение по d_k измерениям имеет дисперсию d_k, то есть
    логиты растут по модулю с ростом размерности головы. Softmax от больших
    логитов вырождается в почти one-hot распределение, его якобиан стремится к
    нулю и градиент через attention перестаёт течь. Деление на sqrt(d_k)
    возвращает дисперсию логитов к единице, поэтому распределение внимания на
    старте обучения остаётся достаточно пологим.

- id: lora_01
  topic: finetuning
  question: "Как устроен LoRA, что такое ранг и alpha, и чем QLoRA отличается от LoRA?"
  key_points:
    - "обновление весов приближается низкоранговым разложением: W + BA, r << d"
    - "базовые веса заморожены, обучаются только A и B — на порядки меньше параметров"
    - "A инициализируется случайно, B нулями, поэтому на старте адаптер не меняет модель"
    - "масштаб вклада — alpha / r; alpha задаёт силу адаптера независимо от ранга"
    - "адаптеры можно слить в веса, поэтому на инференсе нет накладных расходов"
    - "QLoRA = базовая модель в 4-bit NF4 + LoRA поверх, градиенты текут через квантованные веса"
  reference: |
    LoRA замораживает исходные веса и учит к ним низкоранговую поправку: вместо
    W обновляется W + (alpha/r) * BA, где A имеет размер r x d, B — d x r, а
    ранг r много меньше размерности слоя, так что обучаемых параметров остаётся
    доли процента. A инициализируют случайно, B — нулями, поэтому в начале
    обучения адаптер тождественен нулю и модель не ломается. Alpha — множитель
    силы адаптера: эффективный масштаб alpha/r позволяет менять ранг, не
    переподбирая learning rate. Адаптеры обычно вешают на проекции attention
    (q, k, v, o), а после обучения сливают в базовые веса, поэтому инференс не
    становится медленнее. QLoRA добавляет к этому квантизацию базовой модели в
    4-bit NF4 с двойной квантизацией и paged-оптимизатором: веса хранятся в 4
    битах и разворачиваются в bf16 на лету, градиенты текут сквозь них в
    fp16/bf16-адаптеры, что позволяет тюнить 30-70B на одной карте.

- id: rope_alibi_01
  topic: architecture
  question: "RoPE против ALiBi: как каждый кодирует позицию и что происходит при выходе за длину обучения?"
  key_points:
    - "RoPE поворачивает Q и K в двумерных подпространствах на угол, пропорциональный позиции"
    - "скалярное произведение после поворота зависит только от разности позиций — относительное кодирование"
    - "ALiBi не трогает эмбеддинги, а вычитает из логитов линейный по расстоянию штраф с наклоном на голову"
    - "за пределами обученной длины RoPE деградирует: нужны position interpolation / NTK-scaling / YaRN"
    - "ALiBi экстраполируется лучше по построению, но жёстко зашивает предпочтение близких токенов"
  reference: |
    RoPE кодирует позицию поворотом: вектора Q и K разбиваются на пары
    координат, каждая пара поворачивается на угол, пропорциональный позиции и
    частоте этой пары. После поворота скалярное произведение q_m и k_n зависит
    только от разности m - n, то есть относительная позиция возникает
    естественно, без отдельных обучаемых эмбеддингов. ALiBi вообще не меняет
    представления: он добавляет к логитам attention штраф -m * |i - j| с
    зафиксированным наклоном m, своим для каждой головы, из-за чего дальние
    токены систематически ослабляются. При выходе за обученную длину RoPE
    попадает в невиданные частотные фазы и качество резко падает, поэтому в
    ход идут интерполяция позиций, NTK-aware масштабирование базы и YaRN, обычно
    с дообучением на длинном контексте. ALiBi экстраполируется на большие длины
    почти без потерь, но его линейный штраф жёстко зашивает локальность, что
    мешает задачам, где важна информация в далёком прошлом.

- id: dpo_ppo_01
  topic: alignment
  question: "DPO против RLHF на PPO: что убирается из пайплайна и чем за это платят?"
  key_points:
    - "в RLHF учится reward-модель на парах предпочтений, затем PPO оптимизирует политику по её награде"
    - "PPO держит KL-штраф к reference-модели, чтобы политика не улетела и не сломала язык"
    - "DPO выводит замкнутую форму оптимума RLHF и учит политику прямо на парах, без reward-модели и сэмплирования"
    - "лосс DPO — логистическая функция от разности логвероятностей chosen и rejected, взвешенной beta, относительно reference"
    - "DPO дешевле и стабильнее, но работает офлайн: обучается только на готовых парах, без исследования"
    - "PPO допускает онлайн-сэмплирование и переиспользование reward-модели, ценой сложности и чувствительности к гиперпараметрам"
  reference: |
    Классический RLHF состоит из трёх шагов: SFT, обучение reward-модели на
    парах человеческих предпочтений и оптимизация политики через PPO по этой
    награде с KL-штрафом к reference-модели, который не даёт политике уехать в
    reward hacking и деградацию языка. DPO замечает, что оптимум такой
    KL-регуляризованной задачи выражается в замкнутой форме через reference-политику,
    и подставляет это выражение обратно в функцию правдоподобия предпочтений.
    В итоге получается обычный supervised-лосс: логистическая функция от beta,
    умноженной на разность логотношений вероятностей выбранного и отвергнутого
    ответов относительно reference-модели. Из пайплайна исчезают reward-модель,
    сэмплирование во время обучения и вся машинерия PPO, поэтому обучение дешевле
    и заметно стабильнее. Плата — офлайновость: DPO учится только на
    зафиксированном наборе пар и не исследует новые ответы, чувствителен к
    качеству и покрытию датасета, а beta приходится подбирать; PPO же позволяет
    сэмплировать онлайн и переиспользовать reward-модель на новых промптах.
