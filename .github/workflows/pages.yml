name: Deploy cards to Pages

# Publishes cards/interview_cards.html as the site root, so the flashcards are
# usable from a phone. The trainer itself (run.py) stays local — it needs Ollama.

on:
  push:
    branches: [main]
    paths:
      - cards/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site
          cp cards/interview_cards.html site/index.html
          cp cards/manifest.webmanifest cards/icon-192.png cards/icon-512.png cards/sw.js site/

      # enablement: true включает Pages сам, если он ещё не включён в настройках
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
